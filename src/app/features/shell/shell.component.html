<div class="app-shell">
  <div class="mobile-topbar">
    <button class="hamburger" (click)="toggleSidebar()">
      <i class="ti ti-menu-2"></i>
    </button>
    <span class="mobile-logo">TaskFlow</span>
    <app-notification-bell class="mobile-bell"></app-notification-bell>
  </div>

  <div class="sidebar-overlay"
       *ngIf="isSidebarOpen"
       (click)="toggleSidebar()">
  </div>

  <aside class="sidebar" [class.open]="isSidebarOpen">
    <div class="logo">
      <div class="logo-icon">
        <i class="ti ti-layout-kanban" aria-hidden="true"></i>
      </div>
      <span class="logo-text">TaskFlow</span>
    </div>

    <nav class="nav">
      <div class="nav-section-label">{{ 'nav.main' | translate }}</div>
      <div
        *ngFor="let item of navItems"
        class="nav-item"
        [class.active]="isActive(item.route)"
        (click)="navigateTo(item.route); isSidebarOpen = false">
        <i class="ti {{ item.icon }}" aria-hidden="true"></i>
        <span>{{ item.labelKey | translate }}</span>
      </div>
    </nav>

    <div class="nav-bottom">
      <div class="nav-section-label">{{ 'nav.account' | translate }}</div>
      <div class="nav-item" (click)="navigateTo('settings'); isSidebarOpen = false">
        <i class="ti ti-settings" aria-hidden="true"></i>
        <span>{{ 'nav.settings' | translate }}</span>
      </div>

      <div class="user-section" (click)="toggleUserMenu()">
        <div class="avatar">{{ initials }}</div>
        <div class="user-info">
          <span class="user-name">{{ currentUser?.name }}</span>
          <span class="user-role">{{ 'nav.member' | translate }}</span>
        </div>
        <i class="ti ti-chevron-up" aria-hidden="true"
           [style.transform]="showUserMenu ? 'rotate(180deg)' : 'rotate(0)'"></i>
      </div>

      <div class="user-menu" *ngIf="showUserMenu">
        <div class="menu-item" (click)="navigateTo('settings')">
          <i class="ti ti-user" aria-hidden="true"></i> {{ 'nav.profile' | translate }}
        </div>
        <div class="menu-item logout" (click)="logout()">
          <i class="ti ti-logout" aria-hidden="true"></i> {{ 'nav.logout' | translate }}
        </div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar-strip">
      <app-notification-bell></app-notification-bell>
    </div>
    <div class="content-area">
      <router-outlet />
    </div>
  </main>
</div>
